<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mobilité">
  <meta name="theme-color" content="#0E0D0B">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Mobilité</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E0D0B;
      --surface: #1A1815;
      --surface-2: #26221D;
      --text: #F0EBE0;
      --muted: #7A736A;
      --accent: #E8A15C;
      --accent-dim: #8A5F36;
      --success: #7FB069;
      --border: #2A2620;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* --- Layout --- */
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 32px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Home screen --- */
    .home-header {
      margin-bottom: 40px;
    }

    .home-header-compact {
      margin-bottom: 20px;
    }

    /* --- Session cards --- */
    .sessions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .session-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 18px 18px 20px;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .session-card:active { background: var(--surface-2); }

    .session-card-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      padding: 22px 22px 22px 24px;
    }

    .session-card-primary:active {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }

    .session-card-empty {
      opacity: 0.55;
      cursor: default;
    }

    .session-card.done {
      border-color: var(--success);
    }

    .session-card-primary.done {
      border-color: var(--bg);
    }

    .session-card-head {
      flex: 1;
      min-width: 0;
    }

    .session-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    .session-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .session-card-primary .session-title {
      font-size: 26px;
    }

    .session-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      opacity: 0.7;
    }

    .session-cta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .sessions-divider {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin: 8px 0 4px;
    }

    .exo-count-manual {
      font-size: 64px;
      color: var(--muted);
    }

    .home-date {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .home-title {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .home-meta {
      font-size: 15px;
      color: var(--muted);
      margin-top: 16px;
    }

    .exercises-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 32px -20px 24px;
    }

    .preview-item {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .preview-item:first-child { border-top: 1px solid var(--border); }

    .preview-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      min-width: 24px;
    }

    .preview-name {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }

    .preview-vol {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .btn-primary {
      display: block;
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 20px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    .btn-primary:active { opacity: 0.7; }

    .btn-secondary {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 12px;
    }

    .btn-secondary:active { background: var(--surface); }

    /* --- Week strip --- */
    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 32px;
    }

    .day-btn {
      position: relative;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid transparent;
      padding: 10px 0 12px;
      font-family: 'JetBrains Mono', monospace;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .day-letter {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      opacity: 0.75;
    }

    .date-num {
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }

    .day-btn.today {
      border-color: var(--accent);
      color: var(--accent);
    }

    .day-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    .day-btn.empty {
      opacity: 0.4;
    }

    .day-btn.done::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    /* --- Weight row --- */
    .weight-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 16px 0;
      margin-bottom: 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .weight-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .weight-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      padding: 0;
      outline: none;
      text-align: right;
      user-select: text;
      -webkit-user-select: text;
      -moz-appearance: textfield;
      min-width: 0;
    }

    .weight-input::-webkit-outer-spin-button,
    .weight-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .weight-input::placeholder {
      color: var(--muted);
      opacity: 0.4;
    }

    .weight-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--muted);
    }

    /* --- Exercise screen --- */
    .exo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .exo-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .exo-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .exo-image {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
    }

    .exo-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .exo-image .exo-svg {
      width: 72%;
      height: 72%;
      display: block;
    }

    .exo-name {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .exo-desc {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .exo-count {
      text-align: center;
      margin: auto 0 32px;
    }

    .exo-count-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.04em;
    }

    .exo-count-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Grand badge côté (perSide) : impossible à louper d'un coup d'œil */
    .exo-side-big {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      background: var(--accent);
      color: var(--bg);
      border-radius: 8px;
      padding: 14px 20px;
      margin: 0 0 20px;
      transition: background 0.2s;
    }

    .exo-side-big[data-side="right"] {
      background: var(--success);
    }

    .exo-side-arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
    }

    .exo-side-label {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .exo-side-half {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.7;
    }

    .exo-set {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .exo-set-dots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .exo-set-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      transition: background 0.15s;
    }

    .exo-set-dot.done {
      background: var(--success);
      border-color: var(--success);
    }

    .exo-set-dot.current {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 161, 92, 0.25);
    }

    .exo-set-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .exo-set-label .exo-set-current {
      color: var(--accent);
      font-size: 26px;
    }

    /* --- Rest screen --- */
    .rest-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .rest-label {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .rest-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 160px;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.05em;
      margin-bottom: 32px;
    }

    .rest-progress {
      width: 100%;
      height: 2px;
      background: var(--surface);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 40px;
    }

    .rest-progress-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transform-origin: left;
      transition: transform 1s linear;
    }

    .rest-next {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .rest-next-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .rest-adjust {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .rest-adjust button {
      flex: 1;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .rest-adjust button:active { background: var(--surface); }

    /* --- Done screen --- */
    .done-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .done-check {
      font-size: 64px;
      color: var(--success);
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
    }

    .done-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .done-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 48px;
      line-height: 1.8;
    }

    /* --- Empty state --- */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .hidden { display: none !important; }
  </style>
</head>

      if (!key) return null;
      if (key === 'mobility') return routine[dowOf(state.date)] || null;
      if (key.startsWith('futsal-')) return futsal[key.slice(7)] || null;
      return null;
    }

    function workoutMin(w) {
      if (!w) return 0;
      if (w.estimatedMin) return w.estimatedMin;
      return Math.round((w.exercises.reduce((n, e) => n + e.sets, 0) * 75) / 60);
    }

    const dayNames = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
    const dayShort = ['D', 'L', 'Ma', 'Me', 'J', 'V', 'S'];

    // ============================================
    // STATE
    // ============================================
    function todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    let state = {
      screen: 'home',      // 'home' | 'exo' | 'rest' | 'done'
      date: todayIso(),
      workoutKey: null,    // 'mobility' | 'futsal-A' | 'futsal-B1' | 'futsal-B2'
      exoIndex: 0,
      setIndex: 0,
      startTime: null,
      restRemaining: 0,
      restTotal: 30,
      restTimer: null,
      exoRemaining: 0,
      exoHalfDone: false,
      manualHalfDone: false,
      exoTimer: null,
      audioCtx: null,
    };

    // ============================================
    // AUDIO
    // ============================================
    function initAudio() {
      if (!state.audioCtx) {
        try {
          state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}
      }
      // iOS needs resume after user gesture
      if (state.audioCtx && state.audioCtx.state === 'suspended') {
        state.audioCtx.resume();
      }
    }

    function beep(freq = 880, duration = 180, volume = 0.25) {
      if (!state.audioCtx) return;
      const ctx = state.audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    }

    function beepDouble() {
      beep(880, 150);
      setTimeout(() => beep(1174, 250), 180);
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function goHome() {
      clearRest();
      clearExoTimer();
      state.workoutKey = null;
      state.manualHalfDone = false;
      state.screen = 'home';
      render();
    }

    function dowOf(iso) {
      return new Date(iso + 'T00:00:00').getDay();
    }

    function startWorkout(key) {
      initAudio();
      const w = getWorkout(key);
      if (!w || !w.exercises.length) return;
      state.workoutKey = key;
      state.exoIndex = 0;
      state.setIndex = 0;
      state.manualHalfDone = false;
      state.startTime = Date.now();
      state.screen = 'exo';
      render();
    }

    function completeSet() {
      initAudio();
      const w = getWorkout(state.workoutKey);
      const exo = w.exercises[state.exoIndex];

      // Manuel perSide : un tap = un côté, deux taps = série finie.
      if (exo.manual && exo.perSide && !state.manualHalfDone) {
        state.manualHalfDone = true;
        beep(880, 120, 0.15);
        render();
        return;
      }
      state.manualHalfDone = false;

      const isLastSet = state.setIndex >= exo.sets - 1;
      const isLastExo = state.exoIndex >= w.exercises.length - 1;

      if (isLastSet && isLastExo) {
        saveCompletion(state.date, state.workoutKey);
        state.screen = 'done';
        render();
        return;
      }

      if (exo.rest > 0) {
        startRest(exo.rest);
      } else {
        advanceExercise();
      }
    }

    function startRest(seconds) {
      state.restRemaining = seconds;
      state.restTotal = seconds;
      state.screen = 'rest';
      render();

      state.restTimer = setInterval(() => {
        state.restRemaining--;
        if (state.restRemaining <= 0) {
          endRest();
        } else if (state.restRemaining <= 3) {
          beep(660, 120, 0.15);
          updateRestUI();
        } else {
          updateRestUI();
        }
      }, 1000);
    }

    function updateRestUI() {
      const valueEl = document.querySelector('.rest-value');
      const barEl = document.querySelector('.rest-progress-bar');
      if (valueEl) valueEl.textContent = state.restRemaining;
      if (barEl) barEl.style.transform = `scaleX(${state.restRemaining / state.restTotal})`;
    }

    function clearRest() {
      if (state.restTimer) {
        clearInterval(state.restTimer);
        state.restTimer = null;
      }
    }

    function endRest() {
      clearRest();
      beepDouble();
      advanceExercise();
    }

    function skipRest() {
      clearRest();
      advanceExercise();
    }

    function adjustRest(delta) {
      if (state.screen !== 'rest') return;
      const next = state.restRemaining + delta;
      if (next <= 0) {
        endRest();
        return;
      }
      state.restRemaining = next;
      if (delta > 0) state.restTotal += delta;
      updateRestUI();
    }

    function clearExoTimer() {
      if (state.exoTimer) {
        clearInterval(state.exoTimer);
        state.exoTimer = null;
      }
    }

    function updateExoTimerUI() {
      const valEl = document.querySelector('.exo-count-value');
      if (valEl) valEl.textContent = state.exoRemaining;

      const badgeEl = document.querySelector('.exo-side-big');
      if (badgeEl) {
        const right = state.exoHalfDone;
        badgeEl.dataset.side = right ? 'right' : 'left';
        badgeEl.querySelector('.exo-side-arrow').textContent = right ? '→' : '←';
        badgeEl.querySelector('.exo-side-label').textContent = right ? 'DROITE' : 'GAUCHE';
        badgeEl.querySelector('.exo-side-half').textContent = right ? '2/2' : '1/2';
      }
    }

    function startExoTimer() {
      clearExoTimer();
      const w = getWorkout(state.workoutKey);
      const exo = w && w.exercises[state.exoIndex];
      if (!exo || !exo.duration) return;
      state.exoRemaining = exo.duration;
      state.exoHalfDone = false;
      updateExoTimerUI();
      state.exoTimer = setInterval(() => {
        state.exoRemaining--;
        if (state.exoRemaining > 0) {
          if (state.exoRemaining <= 3) beep(660, 120, 0.15);
          updateExoTimerUI();
          return;
        }
        if (exo.perSide && !state.exoHalfDone) {
          state.exoHalfDone = true;
          state.exoRemaining = exo.duration;
          beepDouble();
          updateExoTimerUI();
          return;
        }
        clearExoTimer();
        beepDouble();
        completeSet();
      }, 1000);
    }

    function advanceExercise() {
      const w = getWorkout(state.workoutKey);
      const exo = w.exercises[state.exoIndex];
      const isLastSet = state.setIndex >= exo.sets - 1;

      if (isLastSet) {
        state.exoIndex++;
        state.setIndex = 0;
      } else {
        state.setIndex++;
      }
      state.manualHalfDone = false;
      state.screen = 'exo';
      render();
    }

    function selectDate(iso) {
      state.date = iso;
      render();
    }

    // ============================================
    // WEEK & STORAGE (completions + weights per date)
    // ============================================
    function getWeekDates(iso) {
      const d = new Date(iso + 'T00:00:00');
      const dow = d.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      d.setDate(d.getDate() + diff);
      const week = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(d);
        cur.setDate(d.getDate() + i);
        week.push({
          iso: `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`,
          dow: cur.getDay(),
          num: cur.getDate(),
        });
      }
      return week;
    }

    function loadCompletions() {
      try { return JSON.parse(localStorage.getItem('completions') || '{}'); }
      catch (e) { return {}; }
    }

    // Migre l'ancien format (bool) vers { mobility: true }.
    function completionsFor(iso) {
      const raw = loadCompletions()[iso];
      if (!raw) return {};
      if (raw === true) return { mobility: true };
      return raw;
    }

    function saveCompletion(iso, key) {
      const c = loadCompletions();
      const cur = c[iso] === true ? { mobility: true } : (c[iso] || {});
      cur[key || 'mobility'] = true;
      c[iso] = cur;
      localStorage.setItem('completions', JSON.stringify(c));
    }

    function isDoneOn(iso) {
      const raw = loadCompletions()[iso];
      if (!raw) return false;
      if (raw === true) return true;
      return Object.keys(raw).length > 0;
    }

    function isWorkoutDoneOn(iso, key) {
      return !!completionsFor(iso)[key];
    }

    function loadWeights() {
      try { return JSON.parse(localStorage.getItem('weights') || '{}'); }
      catch (e) { return {}; }
    }

    function saveWeight(iso, val) {
      const w = loadWeights();
      const num = parseFloat(String(val).replace(',', '.'));
      if (!isFinite(num) || num <= 0) {
        delete w[iso];
      } else {
        w[iso] = num;
      }
      localStorage.setItem('weights', JSON.stringify(w));
    }

    function formatDuration(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min} min ${String(sec).padStart(2, '0')}`;
    }

    // ============================================
    // RENDER
    // ============================================
    function render() {
      const app = document.getElementById('app');
      const html = {
        home: renderHome,
        exo: renderExo,
        rest: renderRest,
        done: renderDone,
      }[state.screen]();
      app.innerHTML = html;
      if (state.screen === 'exo') {
        startExoTimer();
      } else {
        clearExoTimer();
      }
    }

    function renderHome() {
      const today = todayIso();
      const dow = dowOf(state.date);
      const day = routine[dow];
      const isToday = state.date === today;
      const selected = new Date(state.date + 'T00:00:00');
      const dateStr = selected.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
      const weight = loadWeights()[state.date] ?? '';

      const weekStrip = `
        <div class="week-strip">
          ${getWeekDates(state.date).map(d => `
            <button class="day-btn ${d.iso === today ? 'today' : ''} ${d.iso === state.date ? 'active' : ''} ${!routine[d.dow] ? 'empty' : ''} ${isDoneOn(d.iso) ? 'done' : ''}"
                    onclick="selectDate('${d.iso}')">
              <span class="day-letter">${dayShort[d.dow]}</span>
              <span class="date-num">${d.num}</span>
            </button>
          `).join('')}
        </div>
      `;

      const weightRow = `
        <div class="weight-row">
          <label class="weight-label" for="weight-in">Poids</label>
          <input id="weight-in" class="weight-input" type="number" step="0.1" inputmode="decimal"
                 value="${weight}" placeholder="—"
                 onchange="saveWeight('${state.date}', this.value)">
          <span class="weight-unit">kg</span>
        </div>
      `;

      const dateLine = `
        <div class="home-header home-header-compact">
          <div class="home-date">${isToday ? "Aujourd'hui" : dayNames[dow]} · ${dateStr}</div>
        </div>
      `;

      const mobilityCard = day ? `
        <button class="session-card session-card-primary ${isWorkoutDoneOn(state.date, 'mobility') ? 'done' : ''}"
                onclick="startWorkout('mobility')">
          <div class="session-card-head">
            <div class="session-eyebrow">Mobilité · ${dayNames[dow]}</div>
            <div class="session-title">${day.name}</div>
            <div class="session-meta">${day.exercises.length} exercices · ~${workoutMin(day)} min</div>
          </div>
          <div class="session-cta">${isWorkoutDoneOn(state.date, 'mobility') ? 'Refaire' : 'Commencer'} →</div>
        </button>
      ` : `
        <div class="session-card session-card-empty">
          <div class="session-card-head">
            <div class="session-eyebrow">Mobilité</div>
            <div class="session-title">Pas configuré</div>
            <div class="session-meta">Aucun exercice pour ce jour.</div>
          </div>
        </div>
      `;

      const futsalCards = Object.keys(futsal).map(id => {
        const w = futsal[id];
        const key = 'futsal-' + id;
        const done = isWorkoutDoneOn(state.date, key);
        return `
          <button class="session-card ${done ? 'done' : ''}" onclick="startWorkout('${key}')">
            <div class="session-card-head">
              <div class="session-eyebrow">Futsal</div>
              <div class="session-title">${w.short}</div>
              <div class="session-meta">${w.exercises.length} blocs · ~${w.estimatedMin} min</div>
            </div>
            <div class="session-cta">${done ? 'Refaire' : 'Commencer'} →</div>
          </button>
        `;
      }).join('');

      return `
        <div class="screen">
          ${weekStrip}
          ${weightRow}
          ${dateLine}

          <div class="sessions">
            ${mobilityCard}
            <div class="sessions-divider">Ou une séance futsal</div>
            ${futsalCards}
          </div>
        </div>
      `;
    }

    function renderExo() {
      const w = getWorkout(state.workoutKey);
      const exo = w.exercises[state.exoIndex];
      const totalExos = w.exercises.length;

      const isTimed = !!exo.duration;
      const isManual = !!exo.manual;

      // Grand badge côté visible pour les exos chronométrés/manuels perSide.
      // Côté 1 = GAUCHE, Côté 2 = DROITE (convention de l'entraînement).
      const showSideBadge = exo.perSide && (isTimed || isManual);
      const halfDone = isManual ? state.manualHalfDone : state.exoHalfDone;
      const sideBadge = showSideBadge ? `
        <div class="exo-side-big" data-side="${halfDone ? 'right' : 'left'}">
          <span class="exo-side-arrow">${halfDone ? '→' : '←'}</span>
          <span class="exo-side-label">${halfDone ? 'DROITE' : 'GAUCHE'}</span>
          <span class="exo-side-half">${halfDone ? '2' : '1'}/2</span>
        </div>
      ` : '';

      let countBlock;
      if (isManual) {
        countBlock = `
          <div class="exo-count">
            <div class="exo-count-value exo-count-manual">—</div>
            <div class="exo-count-label">Appuie en arrivant</div>
          </div>
        `;
      } else {
        const countValue = exo.reps ?? exo.duration;
        const countLabel = exo.reps
          ? (exo.perSide ? 'reps chaque côté' : 'reps')
          : 'secondes';
        countBlock = `
          <div class="exo-count">
            <div class="exo-count-value">${countValue}</div>
            <div class="exo-count-label">${countLabel}</div>
          </div>
        `;
      }

      const illustration = exo.icon
        ? `<svg class="exo-svg" viewBox="0 0 100 100" role="img" aria-label="${exo.name}"><use href="#${exo.icon}"/></svg>`
        : (exo.image
            ? `<img src="${exo.image}" alt="${exo.name}" onerror="this.style.display='none'; this.parentElement.textContent='Image manquante'">`
            : '<span>Image à venir</span>');

      return `
        <div class="screen">
          <div class="exo-header">
            <div class="exo-progress">${String(state.exoIndex + 1).padStart(2, '0')} / ${String(totalExos).padStart(2, '0')} · ${w.short || w.name}</div>
            <button class="exo-close" onclick="goHome()">×</button>
          </div>

          <div class="exo-image">${illustration}</div>

          <div class="exo-name">${exo.name}</div>
          <div class="exo-desc">${exo.description}</div>

          ${sideBadge}
          ${countBlock}

          <div class="exo-set">
            <div class="exo-set-dots">
              ${Array.from({ length: exo.sets }, (_, i) => {
                const cls = i < state.setIndex ? 'done' : (i === state.setIndex ? 'current' : '');
                return `<span class="exo-set-dot ${cls}"></span>`;
              }).join('')}
            </div>
            <div class="exo-set-label">Série <span class="exo-set-current">${state.setIndex + 1}</span> / ${exo.sets}</div>
          </div>
          <button class="btn-primary" onclick="completeSet()">Fait</button>
        </div>
      `;
    }

    function renderRest() {
      const w = getWorkout(state.workoutKey);
      const exo = w.exercises[state.exoIndex];
      const isLastSet = state.setIndex >= exo.sets - 1;
      const nextExo = isLastSet ? w.exercises[state.exoIndex + 1] : exo;
      const nextSet = isLastSet ? 1 : state.setIndex + 2;

      return `
        <div class="screen">
          <div class="rest-container">
            <div class="rest-label">Repos</div>
            <div class="rest-value">${state.restRemaining}</div>
            <div class="rest-progress">
              <div class="rest-progress-bar" style="transform: scaleX(${state.restRemaining / state.restTotal});"></div>
            </div>
            <div class="rest-next">Prochain</div>
            <div class="rest-next-name">${nextExo.name} · Série ${nextSet}</div>
          </div>
          <div class="rest-adjust">
            <button onclick="adjustRest(-15)">−15s</button>
            <button onclick="adjustRest(15)">+15s</button>
          </div>
          <button class="btn-secondary" onclick="skipRest()">Passer</button>
        </div>
      `;
    }

    function renderDone() {
      const w = getWorkout(state.workoutKey);
      const totalSets = w.exercises.reduce((n, e) => n + e.sets, 0);
      const duration = Date.now() - state.startTime;

      return `
        <div class="screen">
          <div class="done-container">
            <div class="done-check">✓</div>
            <div class="done-title">Terminé</div>
            <div class="done-stats">
              ${w.name}<br>
              ${w.exercises.length} exercices · ${totalSets} séries<br>
              ${formatDuration(duration)}
            </div>
          </div>
          <button class="btn-primary" onclick="goHome()">Retour</button>
        </div>
      `;
    }

    // ============================================
    // INIT
    // ============================================
    // Prevent bounce scroll on iOS
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.rest-container, .exo-count, .home-title, .done-container')) {
        e.preventDefault();
      }
    }, { passive: false });

    // Keep screen awake during workout (best-effort; not all iOS versions)
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });
    requestWakeLock();

    // Service worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    render();
  </script>
</body>
</html>
